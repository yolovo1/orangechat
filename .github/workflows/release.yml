name: Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Build web-ui
        run: |
          cd web-ui
          pnpm install --frozen-lockfile
          pnpm run build
          cd ..
      - name: Build web-ui
        run: |
          cd web-ui
          rm -f pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
          pnpm run build
          cd ..
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/app.key \
            -alias orangechat \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass yanqi0604 \
            -keypass yanqi0604 \
            -dname "CN=orangechat, OU=dev, O=dev, L=dev, ST=dev, C=CN"

      - name: Write signing config
        run: |
          echo "storeFile=app/app.key" > local.properties
          echo "storePassword=yanqi0604" >> local.properties
          echo "keyAlias=orangechat" >> local.properties
          echo "keyPassword=yanqi0604" >> local.properties

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: orangechat-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "Release ${{ steps.version.outputs.version }}" \
            --generate-notes \
            app/build/outputs/apk/release/*.apk
